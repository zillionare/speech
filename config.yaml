model:
  model_id: gafiatulin/vibevoice-1.5b-mlx
  tts_provider: omnivoice
  quantize_bits: 8
  diffusion_steps: 30
  cfg_scale: 1.0
  max_speech_tokens: 200
  seed: 42
  use_semantic: true
  use_coreml_semantic: false
  use_remote_qwen: true
  qwen_base_url: http://192.168.0.102:8000
  qwen_model_id: Qwen3-TTS-12Hz-1.7B-Base-8bit
  minimax_api_mode: native
  minimax_base_url: https://api.minimaxi.com
